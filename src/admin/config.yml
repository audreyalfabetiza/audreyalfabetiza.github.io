backend:
  name: git-gateway
  branch: main
locale: pt
media_folder: src/uploads
public_folder: /uploads
site_url: /
display_url: /
collections:
  - name: conteudos
    label: Conteúdos (textos)
    label_singular: Conteúdo
    folder: src/conteudos
    create: true
    extension: md
    slug: "{{slug}}"
    summary: "{{title}} · {{date | date('DD/MM/YYYY')}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: Título, name: title, widget: string, hint: "Inclua a pergunta que a família faria no Google. Ex.: Meu filho conhece as letras, mas não consegue ler: por quê?" }
      - { label: Publicar no site, name: publicado, widget: boolean, default: false, hint: "Desligado = rascunho, não aparece no site." }
      - { label: Data, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: Categoria, name: categoria, widget: select, options: ["Para famílias", "Para professores", "Ciência da leitura"], default: "Para famílias" }
      - { label: Descrição para o Google (até 155 caracteres), name: description, widget: text, pattern: ["^.{40,160}$", "Entre 40 e 160 caracteres"] }
      - { label: Resposta rápida (2 a 3 frases que respondem a pergunta do título), name: resumo, widget: text, required: false }
      - { label: Foto de capa, name: imagem, widget: image, required: false }
      - { label: Descrição da foto (para acessibilidade e Google), name: imagem_alt, widget: string, required: false }
      - { label: Texto, name: body, widget: markdown }
      - label: Perguntas relacionadas (opcional)
        name: perguntas
        widget: list
        required: false
        fields:
          - { label: Pergunta, name: pergunta, widget: string }
          - { label: Resposta, name: resposta, widget: text }
  - name: configuracoes
    label: Configurações do site
    files:
      - label: Dados de contato e endereço
        name: site
        file: src/_data/site.json
        fields:
          - { label: Nome, name: nome, widget: string }
          - { label: Profissão, name: profissao, widget: string }
          - { label: Slogan, name: slogan, widget: string }
          - { label: Descrição, name: descricao, widget: text }
          - { label: Endereço do site (ex.: https://www.audreyamericano.com.br), name: url, widget: string, required: false }
          - { label: WhatsApp (só números, com 55), name: whatsapp, widget: string }
          - { label: Telefone (como aparece no site), name: telefone, widget: string }
          - { label: Rua e número, name: rua, widget: string }
          - { label: Bairro, name: bairro, widget: string }
          - { label: Cidade, name: cidade, widget: string }
          - { label: Estado, name: estado, widget: string }
          - { label: CEP, name: cep, widget: string }
          - { label: Latitude, name: latitude, widget: number, value_type: float }
          - { label: Longitude, name: longitude, widget: number, value_type: float }
          - { label: Link do Google Maps, name: mapa, widget: string }
          - { label: Link do Waze, name: waze, widget: string, required: false }
          - { label: Instagram (link), name: instagram, widget: string, required: false }
          - { label: Link para avaliar/ver avaliações no Google, name: google_avaliacoes, widget: string, required: false }
          - { label: Bairros próximos que atende, name: bairros_proximos, widget: list, required: false, field: { label: Bairro, name: bairro, widget: string } }
      - label: Perguntas frequentes
        name: faq
        file: src/_data/faq.json
        fields:
          - label: Perguntas
            name: itens
            widget: list
            fields:
              - { label: Pergunta, name: pergunta, widget: string }
              - { label: Resposta, name: resposta, widget: text }
      - label: Depoimentos (só com autorização por escrito)
        name: depoimentos
        file: src/_data/depoimentos.json
        fields:
          - label: Depoimentos
            name: itens
            widget: list
            required: false
            fields:
              - { label: Texto, name: texto, widget: text }
              - { label: Nome (ex.: Mariana S.), name: nome, widget: string }
              - { label: Relação (ex.: mãe de aluno), name: relacao, widget: string, required: false }
